global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "servers"
    static_configs:
      - targets:
          - "server-1:9100"
          - "server-2:9100"
          - "server-3:9100"